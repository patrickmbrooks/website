# XcodeGen spec. Run `xcodegen generate` in this folder to produce RetainerSign.xcodeproj
name: RetainerSign
options:
  bundleIdPrefix: com.patrickbrookslaw
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
targets:
  RetainerSign:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickbrookslaw.retainersign
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: RetainerSign
        UILaunchScreen: {}
        NSCameraUsageDescription: RetainerSign uses the camera to scan paper retainer agreements.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # OAuth redirect for DocuSign sign-in (must match the redirect URI registered on the integration key)
        CFBundleURLTypes:
          - CFBundleURLName: com.patrickbrookslaw.retainersign.oauth
            CFBundleURLSchemes: [retainersign]
